<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 11 - Countdown Timer</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        color: #172554;
        background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      }
      .panel {
        width: min(100%, 520px);
        padding: clamp(24px, 6vw, 42px);
        text-align: center;
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 18px 48px rgba(30, 64, 175, 0.13);
      }
      .eyebrow {
        margin: 0 0 10px;
        color: #4f46e5;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.2rem); }
      .description { color: #64748b; line-height: 1.6; }
      .clock {
        margin: 26px 0;
        color: #1d4ed8;
        font-size: clamp(4rem, 18vw, 7rem);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
      }
      .duration {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin: 22px 0;
      }
      .duration label {
        display: grid;
        gap: 7px;
        color: #475569;
        font-size: 0.9rem;
        font-weight: 700;
      }
      input {
        width: 100px;
        padding: 11px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        color: #172554;
        font: inherit;
        text-align: center;
      }
      input:disabled { background: #f1f5f9; }
      .actions { display: flex; justify-content: center; gap: 10px; }
      button {
        min-width: 105px;
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #1d4ed8; }
      button.secondary { background: #e2e8f0; color: #1e293b; }
      button.secondary:hover:not(:disabled) { background: #cbd5e1; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      .status { min-height: 24px; margin: 20px 0 0; color: #475569; }
      .author { margin: 24px 0 0; color: #94a3b8; font-size: 0.85rem; }
      @media (max-width: 430px) {
        .actions { flex-wrap: wrap; }
        button { flex: 1 1 40%; }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">Experiment 11 · JavaScript Modules</p>
      <h1>Focus Countdown</h1>
      <p class="description">Choose a duration and let the live countdown keep you on track.</p>

      <div class="clock" id="clock" role="timer" aria-live="off">05:00</div>

      <div class="duration" aria-label="Countdown duration">
        <label for="minutes">Minutes
          <input id="minutes" type="number" min="0" max="99" value="5" inputmode="numeric" />
        </label>
        <label for="seconds">Seconds
          <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" />
        </label>
      </div>

      <div class="actions">
        <button id="startButton" type="button">Start</button>
        <button class="secondary" id="pauseButton" type="button" disabled>Pause</button>
        <button class="secondary" id="resetButton" type="button">Reset</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">Set a duration, then start the timer.</p>
      <p class="author">Created by Swaarnim Diwan</p>
    </main>
    <script type="module" src="experiment11.js"></script>
  </body>
</html>
