<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 3 - Student Grading System</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 16px;
        background: linear-gradient(135deg, #fff7ed, #fdf2f8);
        color: #431407;
        font-family: Arial, sans-serif;
      }
      main { width: min(100%, 620px); margin: 0 auto; }
      .panel {
        padding: clamp(22px, 5vw, 36px);
        background: white;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(154, 52, 18, 0.1);
      }
      .eyebrow {
        margin: 0 0 9px;
        color: #c2410c;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.2rem); }
      .description { color: #64748b; line-height: 1.6; }
      form { display: grid; gap: 15px; margin: 24px 0; }
      label { display: grid; gap: 7px; color: #334155; font-weight: 700; }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font: inherit;
      }
      button {
        padding: 12px 17px;
        border: 0;
        border-radius: 10px;
        background: #c2410c;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #9a3412; }
      .result {
        min-height: 56px;
        padding: 15px;
        border-radius: 12px;
        background: #fff7ed;
        color: #9a3412;
        line-height: 1.6;
      }
      .error { color: #b91c1c; background: #fef2f2; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <p class="eyebrow">Experiment 3 · Control Structures & Validation</p>
        <h1>Student grading system</h1>
        <p class="description">
          Enter a student name and marks from 0 to 100. The form validates the input
          and uses conditional logic to determine a grade.
        </p>
        <form id="gradeForm" novalidate>
          <label for="studentInput">Student name
            <input id="studentInput" name="student" autocomplete="name" required />
          </label>
          <label for="marksInput">Marks (0–100)
            <input id="marksInput" name="marks" type="number" min="0" max="100" step="1" required />
          </label>
          <button type="submit">Calculate grade</button>
        </form>
        <div class="result" id="gradeResult" role="status" aria-live="polite">
          Grade results will appear here.
        </div>
      </section>
    </main>
    <script src="experiment3.js" defer></script>
  </body>
</html>
